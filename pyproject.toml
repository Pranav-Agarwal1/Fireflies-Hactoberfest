[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mainline-agent"
version = "0.9.0"
description = "GitHub documentation drift alerts using local AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mainline-agent = "mainline_agent.cli:main"

[tool.setuptools.packages.find]
include = ["mainline_agent*"]
